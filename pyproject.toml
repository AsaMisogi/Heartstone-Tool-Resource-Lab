[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pengpeng-asogi"
version = "0.4.0"
description = "砰砰解析台 · 炉石本地资源工作台"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
authors = [{name = "朝禊ASOGI"}]
dependencies = ["UnityPy==1.25.2", "PySide6==6.10.2", "soundfile==0.13.1", "vosk==0.3.45", "requests==2.34.2"]

[project.urls]
Homepage = "https://github.com/AsaMisogi/Heartstone-Tool-Resource-Lab"
Issues = "https://github.com/AsaMisogi/Heartstone-Tool-Resource-Lab/issues"

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pyinstaller==6.19.0"]

[project.scripts]
pengpeng = "pengpeng.app:main"

[tool.setuptools.package-data]
pengpeng = ["web/*"]

[tool.setuptools.packages.find]
include = ["pengpeng*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["local: 需要本机安装炉石资源的集成测试"]
